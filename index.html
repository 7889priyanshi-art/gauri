<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gauri's B'day Zine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2e7bd; --dot:#e4d296; --ink:#3a1d17; --btn:#6b1f1f; --btn-text:#fbf0c4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a1913; --dot:#3a251c; --ink:#f3e6b8; --btn:#f0dd8a; --btn-text:#3a1d17; }
}
:root[data-theme="dark"]{ --bg:#2a1913; --dot:#3a251c; --ink:#f3e6b8; --btn:#f0dd8a; --btn-text:#3a1d17; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100dvh; background-color:var(--bg); color:var(--ink);
  background-image:radial-gradient(var(--dot) 22%, transparent 24%); background-size:28px 28px;
  font-family:"Chewy","Trebuchet MS",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:12px 0;
}
h1{ margin:0; font-weight:400; font-size:clamp(1.4rem,4.5vw,2.3rem); letter-spacing:.02em; text-align:center; }
#book{
  width:min(94vw, calc((100dvh - 170px) * 984 / 699), 980px);
  aspect-ratio:984/699;
}
.page{ background:#f6eaa8; overflow:hidden; }
.page img{ display:block; width:100%; height:100%; object-fit:cover; user-select:none; -webkit-user-drag:none; }
.controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
button{
  font:inherit; font-size:1.05rem; padding:8px 20px; border:0; border-radius:999px; cursor:pointer;
  background:var(--btn); color:var(--btn-text);
}
button:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
button:disabled{ opacity:.4; cursor:default; }
#label{ min-width:9ch; text-align:center; font-size:1.1rem; }
#hint{ margin:0; font-size:.95rem; opacity:.8; text-align:center; padding:0 12px; }
</style>
</head>

    return;
  }
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pf = new St.PageFlip(document.getElementById("book"), {
    width:492, height:699, size:"stretch",
    minWidth:120, maxWidth:700, minHeight:170, maxHeight:1000,
    showCover:true, usePortrait:false, mobileScrollSupport:false,
    maxShadowOpacity:0.5, flippingTime: reduce ? 250 : 1000

  pf.loadFromHTML(document.querySelectorAll(".page"));

  var names = ["Front cover","Pages 1 and 2","Pages 1 and 2","Pages 3 and 4","Pages 3 and 4","Pages 5 and 6","Pages 5 and 6","Back cover"];
  var label = document.getElementById("label"), hint = document.getElementById("hint");
  var prev = document.getElementById("prev"), next = document.getElementById("next"), play = document.getElementById("play");
  var last = names.length - 1, timer = null;

  function update(i){
    label.textContent = names[i];
    prev.disabled = i === 0;
    next.disabled = i === last;
    if (i > 0) hint.style.display = "none";
    if (i === last && timer) stop("Replay");
  }
  function stop(txt){ clearInterval(timer); timer = null; play.textContent = txt || "Play"; }
  function start(){
    if (pf.getCurrentPageIndex() === last) pf.turnToPage(0);
    play.textContent = "Pause";
    timer = setInterval(function(){ pf.flipNext("bottom"); }, 2600);
    setTimeout(function(){ if (timer) pf.flipNext("bottom"); }, 300);
  }

  pf.on("flip", function(e){ update(e.data); });
  prev.onclick = function(){ stop(); pf.flipPrev("bottom"); };
  next.onclick = function(){ stop(); pf.flipNext("bottom"); };
  play.onclick = function(){ timer ? stop() : start(); };
  document.getElementById("book").addEventListener("pointerdown", function(){ if (timer) stop(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") { stop(); pf.flipNext("bottom"); }
    if (e.key === "ArrowLeft") { stop(); pf.flipPrev("bottom"); }
  });
  update(0);
})();
</script>

            ["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",1],
            ["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",2]];
  var beat=0.5, total=0; tune.forEach(function(n){ total+=n[1]*beat; });
  var ctx=null, master=null, loopTimer=null, wanted=true, started=false;
  var btn=document.getElementById("music");

  function note(freq,t,dur){
    var o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=freq;
    o2.type="sine"; o2.frequency.value=freq/2;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur*0.95);
    o.connect(g); o2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t+dur); o2.stop(t+dur);
  }
  function playLoop(){
    if(!wanted||!ctx) return;
    var t=ctx.currentTime+0.05;
    tune.forEach(function(n){ var d=n[1]*beat; note(N[n[0]],t,d); t+=d; });
    loopTimer=setTimeout(playLoop,(total+1.5)*1000);
  }
  function startMusic(){
    try{
      if(!ctx){
        var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
        ctx=new AC(); master=ctx.createGain(); master.gain.value=0.25; master.connect(ctx.destination);
      }
      if(ctx.state!=="running") ctx.resume();
      if(!started){ started=true; playLoop(); }
    }catch(e){}
  }
  function stopMusic(){
    clearTimeout(loopTimer); started=false;
    if(ctx){ try{ ctx.close(); }catch(e){} ctx=null; master=null; }
  }
  function sync(){ btn.textContent=wanted?"Music: On":"Music: Off"; btn.setAttribute("aria-pressed",wanted); }
  btn.addEventListener("click",function(e){
    e.stopPropagation(); wanted=!wanted; sync();
    if(wanted) startMusic(); else stopMusic();
  });
  function firstTap(){
    if(wanted) startMusic();
    if(started) { document.removeEventListener("click",firstTap); document.removeEventListener("touchend",firstTap); }
  }
  document.addEventListener("click",firstTap);
  document.addEventListener("touchend",firstTap);
  document.addEventListener("visibilitychange",function(){
    if(!ctx) return;
    if(document.hidden) ctx.suspend(); else if(wanted) ctx.resume();
  });
  sync();
})();
</script>
</body>
</html>
